<!doctype html>
<!--
  The browser chrome.

  This document is a normal web page: no custom widgets, no toolkit bindings. It is a
  96-pixel strip at the top of the window, and everything below it is the page.

  It talks to Rust over `window.ipc.postMessage()` and listens with `bir.onEvent()`.
-->
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' bir: data:; script-src 'self' bir:; style-src 'self' bir: 'unsafe-inline'; img-src 'self' bir: data: https:; font-src 'self' bir: data:">
<title>BIR</title>
<style>
/* Critical fallback: keep the browser visibly styled even if bir://chrome.css fails to load. */
:root{--bg:#f4f6fb;--panel:#fff;--fg:#20283b;--muted:#77829a;--line:#dfe4ef;--accent:#4268f5}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.tabstrip{display:flex;align-items:center;gap:6px;padding:5px 8px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:auto}
.tab{display:flex;align-items:center;gap:8px;min-width:42px;max-width:230px;height:35px;padding:0 10px;overflow:hidden;border-radius:10px 10px 0 0;background:transparent;color:var(--muted)}
.tab.active{background:var(--panel);color:var(--fg);box-shadow:inset 0 2px var(--accent)}
.toolbar{display:flex;align-items:center;gap:5px;padding:8px 10px;background:var(--bg)}
.icon-button{width:31px;height:31px;border:0;border-radius:9px;background:transparent;color:var(--muted)}
.omnibox{display:flex;align-items:center;gap:8px;flex:1;min-width:60px;height:35px;padding:0 10px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.omnibox-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg)}
:root[data-tabs="vertical"] body{display:flex;flex-direction:column}
:root[data-tabs="vertical"] .tabstrip{flex:1;min-height:0;flex-direction:column;align-items:stretch;padding:13px 10px 8px}
:root[data-tabs="vertical"] .sidebar-brand{display:flex;align-items:center;gap:9px;padding:0 5px 5px}
:root[data-tabs="vertical"] .brand-mark{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,#547af8,#805ce6);color:#fff;font-weight:800}
:root[data-tabs="vertical"] .brand-name{font-weight:800;letter-spacing:.15em}
:root[data-tabs="vertical"] .brand-edition,:root[data-tabs="vertical"] .tab-section-label{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em}
:root[data-tabs="vertical"] .workspace-label{display:flex;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
:root[data-tabs="vertical"] .tabs{flex-direction:column;align-items:stretch}
:root[data-tabs="vertical"] .tab{width:100%;max-width:none;flex:0 0 36px;border-radius:9px}
:root[data-tabs="vertical"] #new-tab{width:100%;height:36px;border:1px dashed var(--line);border-radius:9px}
:root[data-tabs="vertical"] .new-tab-label,:root[data-tabs="vertical"] .sidebar-brand,:root[data-tabs="vertical"] .workspace-label,:root[data-tabs="vertical"] .tab-section-label{display:flex}
:root[data-tabs="vertical"] .toolbar{flex-wrap:wrap;border-top:1px solid var(--line);background:var(--panel)}
:root[data-tabs="vertical"] .toolbar-caption{display:block;width:100%;font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
:root[data-tabs="vertical"] .omnibox{flex:1 1 100%}
</style>
<link rel="stylesheet" href="bir://chrome.css">
</head>
<body>

<div id="tabstrip" class="tabstrip">
  <div class="sidebar-brand"><span class="brand-mark">b</span><span class="brand-name">BIR</span><span class="brand-edition">BROWSER</span></div>
  <div class="workspace-label"><span class="workspace-dot"></span><span>Personal space</span><span class="workspace-chevron">⌄</span></div>
  <div class="tab-section-label">YOUR TABS</div>
  <div id="tabs" class="tabs" role="tablist"></div>
  <button id="new-tab" class="icon-button" title="New tab (Ctrl+T)" aria-label="New tab"><span class="new-tab-symbol" aria-hidden="true">+</span><span class="new-tab-label">New tab</span></button>
</div>

<div id="toolbar" class="toolbar">
  <div class="toolbar-caption">NAVIGATION</div>
  <button id="back" class="icon-button" title="Back" aria-label="Back" disabled>‹</button>
  <button id="forward" class="icon-button" title="Forward" aria-label="Forward" disabled>›</button>
  <button id="reload" class="icon-button" title="Reload (Ctrl+R)" aria-label="Reload">⟳</button>
  <button id="home" class="icon-button" title="Home" aria-label="Home">⌂</button>

  <div id="omnibox" class="omnibox">
    <span id="omnibox-icon" class="omnibox-icon" title="Connection info">•</span>
    <input id="omnibox-input" class="omnibox-input" type="text" spellcheck="false"
           autocomplete="off" placeholder="Search or type a URL" aria-label="Address bar">
    <button id="omnibox-star" class="icon-button omnibox-star" title="Bookmark this page">☆</button>
    <div id="suggestions" class="suggestions" hidden></div>
  </div>

  <div id="ext-buttons" class="ext-buttons"></div>

  <div class="toolbar-right">
    <button id="downloads" class="icon-button" title="Downloads (Ctrl+J)" aria-label="Downloads">↓</button>
    <button id="menu" class="icon-button" title="Menu" aria-label="Menu">☰</button>
  </div>
</div>

<div id="progress" class="progress" hidden></div>

<div id="findbar" class="findbar" hidden>
  <input id="find-input" class="find-input" type="text" placeholder="Find in page" spellcheck="false">
  <span id="find-count" class="find-count"></span>
  <button id="find-prev" class="icon-button" title="Previous match">↑</button>
  <button id="find-next" class="icon-button" title="Next match">↓</button>
  <button id="find-close" class="icon-button" title="Close (Esc)">×</button>
</div>

<div id="popup" class="popup" hidden></div>
<div id="menu-panel" class="menu-panel" hidden></div>
<div id="permission" class="permission" hidden></div>
<div id="toasts" class="toasts"></div>

<script src="bir://chrome.js"></script>
</body>
</html>
