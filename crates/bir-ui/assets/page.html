<!doctype html>
<!-- Shared shell for BIR internal pages. -->
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' bir: data:; script-src 'self' bir:; style-src 'self' bir: 'unsafe-inline'; img-src 'self' bir: data: https:;">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIR Browser</title>
<style>
/* Critical fallback: the internal pages remain a styled workspace if bir://page.css fails. */
:root{--bg:#f5f6fa;--panel:#fff;--fg:#20283b;--muted:#7d879d;--line:#e2e6ef;--accent:#4268f5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app-shell{display:flex;min-height:100vh}.app-sidebar{position:sticky;top:0;display:flex;flex-direction:column;flex:0 0 224px;width:224px;height:100vh;padding:22px 13px;background:#eef0f7;border-right:1px solid var(--line)}
.app-brand{display:flex;align-items:center;gap:10px;padding:0 9px 26px}.app-brand-mark{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#6384ff,#7e5ce0);color:white;font-size:21px;font-weight:800}
.app-brand strong,.app-brand small{display:block}.app-brand strong{letter-spacing:.14em}.app-brand small{color:var(--muted);font-size:9px;letter-spacing:.18em}
.sidebar-caption{padding:0 10px 8px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.16em}.page-workspace{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:15px}.nav button,.sidebar-footer button{display:flex;align-items:center;gap:11px;min-height:39px;padding:0 11px;border:0;border-radius:10px;background:transparent;color:var(--muted);text-align:left}
.nav button.active{background:var(--panel);color:var(--accent);font-weight:650}.nav-icon{width:20px;font-size:17px}.sidebar-spacer{flex:1}.sidebar-footer{padding-top:10px;border-top:1px solid var(--line)}
.page-main{flex:1;min-width:0}.page-topbar{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:0 35px;border-bottom:1px solid var(--line)}.topbar-kicker{font-size:10px;font-weight:800;letter-spacing:.13em;color:var(--muted)}
.content{max-width:1050px;margin:0 auto;padding:34px 35px 72px}h1{margin:0;font-size:29px;letter-spacing:-.04em}h2{margin:30px 0 12px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.lede,.muted,.small{color:var(--muted)}
.card,.tile{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
input,select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg)}button.action{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}button.action.primary{background:var(--accent);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}.tile{display:flex;align-items:center;gap:12px;cursor:pointer}.tile .letter{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#e9edff;color:#294bd0;font-weight:800}
body[data-page="newtab"] .content{max-width:900px;padding-top:8vh}body[data-page="newtab"] .clock{text-align:center;font-size:clamp(52px,7vw,78px);font-weight:300;letter-spacing:-.07em}body[data-page="newtab"] .clock-sub{text-align:center;margin:10px 0 35px}body[data-page="newtab"] .newtab-search{display:flex;gap:8px;max-width:700px;margin:0 auto 42px;padding:7px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}body[data-page="newtab"] .newtab-search input{flex:1;border:0;background:transparent}
@media(max-width:760px){.app-sidebar{flex-basis:70px;width:70px;padding:15px 8px}.app-brand>span:last-child,.sidebar-caption,.page-workspace,.nav button>span:not(.nav-icon),.sidebar-footer button>span:not(.nav-icon){display:none}.nav button,.sidebar-footer button{justify-content:center}.content{padding:24px 18px}}
</style>
<link rel="stylesheet" href="bir://page.css">
</head>
<body data-page="{{PAGE}}">
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-brand"><span class="app-brand-mark">b</span><span><strong>BIR</strong><small>BROWSER</small></span></div>
    <div class="sidebar-caption">WORKSPACE</div>
    <div class="page-workspace"><span class="workspace-indicator"></span> Personal space <span class="workspace-arrow">⌄</span></div>
    <div class="sidebar-caption nav-caption">LIBRARY</div>
    <nav class="nav" aria-label="Browser">
      <button data-nav="newtab"><span class="nav-icon">⌂</span><span>New tab</span></button>
      <button data-nav="history"><span class="nav-icon">◷</span><span>History</span></button>
      <button data-nav="bookmarks"><span class="nav-icon">☆</span><span>Bookmarks</span></button>
      <button data-nav="downloads"><span class="nav-icon">↓</span><span>Downloads</span></button>
      <button data-nav="extensions"><span class="nav-icon">◇</span><span>Extensions</span></button>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-footer">
      <button data-nav="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      <button data-nav="about"><span class="nav-icon">ⓘ</span><span>About BIR</span></button>
      <div class="sidebar-version"><span class="status-dot"></span> Private by design</div>
    </div>
  </aside>
  <div class="page-main">
    <header class="page-topbar"><div class="topbar-kicker">BIR / <span id="page-section">HOME</span></div><div class="topbar-status"><span class="status-dot"></span> Local browser data</div></header>
    <main id="content" class="content"></main>
  </div>
</div>
<script src="bir://page.js"></script>
</body>
</html>
